<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for area fill -->
    <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05" />
    </linearGradient>

    <!-- Glow filter for line -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animation -->
    <style>
      @keyframes draw {
        from { stroke-dashoffset: 2000; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .line-path {
        stroke-dasharray: 2000;
        stroke-dashoffset: 2000;
        animation: draw 1.5s ease-out forwards;
      }
      .area-path {
        opacity: 0;
        animation: fadeIn 1s ease-out 0.5s forwards;
      }
      .data-point {
        opacity: 0;
        animation: fadeIn 0.5s ease-out 1s forwards;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117" rx="8"/>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">
    okeydw/SoundCloud-iOS Downloads
  </text>

  <!-- Stats -->
  <text x="780" y="25" text-anchor="end" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">
    500 total
  </text>
  <text x="780" y="42" text-anchor="end" fill="#3fb950" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    +32 (+6.8%)
  </text>

  <!-- Grid lines -->
  <g opacity="0.1">
    
      <line x1="60" y1="340" x2="760" y2="340"
            stroke="#c9d1d9" stroke-width="1"/>
    
      <line x1="60" y1="268.75" x2="760" y2="268.75"
            stroke="#c9d1d9" stroke-width="1"/>
    
      <line x1="60" y1="197.5" x2="760" y2="197.5"
            stroke="#c9d1d9" stroke-width="1"/>
    
      <line x1="60" y1="126.25" x2="760" y2="126.25"
            stroke="#c9d1d9" stroke-width="1"/>
    
      <line x1="60" y1="55" x2="760" y2="55"
            stroke="#c9d1d9" stroke-width="1"/>
    
  </g>

  <!-- Y-axis labels -->
  
    <text x="50" y="344" text-anchor="end"
          fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      256
    </text>
  
    <text x="50" y="272.75" text-anchor="end"
          fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      317
    </text>
  
    <text x="50" y="201.5" text-anchor="end"
          fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      378
    </text>
  
    <text x="50" y="130.25" text-anchor="end"
          fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      439
    </text>
  
    <text x="50" y="59" text-anchor="end"
          fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      500
    </text>
  

  <!-- X-axis labels -->
  
    <text x="60" y="360" text-anchor="middle"
          fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Oct 25
    </text>
  
    <text x="137.77777777777777" y="360" text-anchor="middle"
          fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Oct 26
    </text>
  
    <text x="215.55555555555554" y="360" text-anchor="middle"
          fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">
