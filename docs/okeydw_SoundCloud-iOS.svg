          fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Nov 3
    </text>
  

  <!-- Area under line -->
  <path d="M 60 340
    L 60.00 340.00 L 137.78 304.96 L 215.56 274.59 L 293.33 244.22 L 371.11 213.85 L 448.89 164.80 L 526.67 140.27 L 604.44 113.40 L 682.22 92.38 L 760.00 55.00
    L 760 340
    Z" fill="url(#areaGradient)" class="area-path"/>

  <!-- Main line with glow -->
  <path d="M 60.00 340.00 L 137.78 304.96 L 215.56 274.59 L 293.33 244.22 L 371.11 213.85 L 448.89 164.80 L 526.67 140.27 L 604.44 113.40 L 682.22 92.38 L 760.00 55.00" fill="none" stroke="#3b82f6" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="line-path"/>

  <!-- Data points -->
  
    <circle cx="60" cy="340" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="137.77777777777777" cy="304.95901639344265" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="215.55555555555554" cy="274.59016393442624" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
