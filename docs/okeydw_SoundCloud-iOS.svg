    <circle cx="701.6666666666666" cy="82.34011627906978" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="760" cy="55" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  

  <!-- Axis lines -->
  <line x1="60" y1="55" x2="60" y2="340"
        stroke="#30363d" stroke-width="2"/>
  <line x1="60" y1="340" x2="760" y2="340"
