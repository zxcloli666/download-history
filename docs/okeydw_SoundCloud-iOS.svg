  <!-- Area under line -->
  <path d="M 60 340
    L 60.00 340.00 L 118.33 315.15 L 176.67 293.60 L 235.00 272.06 L 293.33 250.52 L 351.67 215.73 L 410.00 198.33 L 468.33 179.27 L 526.67 164.36 L 585.00 137.85 L 643.33 112.17 L 701.67 82.34 L 760.00 55.00
    L 760 340
    Z" fill="url(#areaGradient)" class="area-path"/>

  <!-- Main line with glow -->
