    </text>
  
    <text x="293.3333333333333" y="360" text-anchor="middle"
          fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Oct 28
    </text>
  
    <text x="371.1111111111111" y="360" text-anchor="middle"
          fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Oct 29
    </text>
  
    <text x="448.8888888888889" y="360" text-anchor="middle"
