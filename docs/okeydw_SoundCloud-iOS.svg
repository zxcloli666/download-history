    <circle cx="448.8888888888889" cy="164.79508196721312" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="526.6666666666666" cy="140.26639344262296" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="604.4444444444445" cy="113.40163934426229" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="682.2222222222222" cy="92.37704918032787" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="760" cy="55" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  

  <!-- Axis lines -->
  <line x1="60" y1="55" x2="60" y2="340"
        stroke="#30363d" stroke-width="2"/>
  <line x1="60" y1="340" x2="760" y2="340"
        stroke="#30363d" stroke-width="2"/>
</svg>