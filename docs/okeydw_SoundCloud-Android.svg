    <circle cx="620" cy="117.16604666892118" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="666.6666666666667" cy="96.34764964491038" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="713.3333333333334" cy="75.52925262089957" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="760" cy="55" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  

  <!-- Axis lines -->
  <line x1="60" y1="55" x2="60" y2="340"
