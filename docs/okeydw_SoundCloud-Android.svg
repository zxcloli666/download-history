    L 60.00 340.00 L 106.67 327.37 L 153.33 314.36 L 200.00 299.33 L 246.67 280.73 L 293.33 263.47 L 340.00 247.28 L 386.67 227.23 L 433.33 209.89 L 480.00 189.26 L 526.67 163.72 L 573.33 140.10 L 620.00 117.17 L 666.67 96.35 L 713.33 75.53 L 760.00 55.00
