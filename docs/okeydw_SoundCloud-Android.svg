  <!-- Area under line -->
  <path d="M 60 340
    L 60.00 340.00 L 130.00 319.59 L 200.00 298.55 L 270.00 274.24 L 340.00 244.17 L 410.00 216.28 L 480.00 190.10 L 550.00 157.69 L 620.00 129.64 L 690.00 96.29 L 760.00 55.00
    L 760 340
    Z" fill="url(#areaGradient)" class="area-path"/>

  <!-- Main line with glow -->
  <path d="M 60.00 340.00 L 130.00 319.59 L 200.00 298.55 L 270.00 274.24 L 340.00 244.17 L 410.00 216.28 L 480.00 190.10 L 550.00 157.69 L 620.00 129.64 L 690.00 96.29 L 760.00 55.00" fill="none" stroke="#3b82f6" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="line-path"/>

  <!-- Data points -->
  
    <circle cx="60" cy="340" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="130" cy="319.5872061235648" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
