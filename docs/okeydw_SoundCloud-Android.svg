    <circle cx="620" cy="129.63914707490432" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="690" cy="96.29305631492619" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  
    <circle cx="760" cy="55" r="4" fill="#3b82f6" stroke="#0d1117" stroke-width="2" class="data-point"/>
  

  <!-- Axis lines -->
